[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sphere-detector"
version = "1.1.0"
description = "Sphere Detector (Depth Test)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pillow",
    "pillow_heif",
    "coremltools==9.1.dev1",
    "opencv-python",
    "torch",
    "torchvision",
    "transformers @ git+https://github.com/pcuenca/transformers@dino-ane-patch",
    "jax>=0.9.1,<0.11",
    "tqdm",
    "armpit",
    "scipy",
    "sympy",
    "tabulate",
    "stablehlo_coreml",
]

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.9.1,<0.11"]
cuda13 = ["jax[cuda13]>=0.9.1,<0.11"]
cuda12 = ["jax[cuda12]>=0.9.1,<0.11"]

[tool.setuptools.packages.find]
where = ["src"]
